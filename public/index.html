<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi mapa de Google Maps</title>
  <style>
    /* Estilos para el mapa */
    #map {
      height: 100vh; /* El mapa ocupará toda la altura de la ventana */
      width: 100%;   /* El mapa ocupará todo el ancho de la ventana */
    }
    h3 {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.8);
      padding: 5px 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h3>Mi mapa de Google Maps</h3>
  <div id="map"></div>

  <script>
    // Función principal para inicializar el mapa
    function initMap() {
      const location = { lat: -30.397, lng: 150.644 }; // Coordenadas de ejemplo
      const map = new google.maps.Map(document.getElementById('map'), {
        zoom: 8,
        center: location
      });
      new google.maps.Marker({ position: location, map: map });
    }

    // Cargar la API de Google Maps con la API key desde el backend
    async function loadMap() {
      const response = await fetch('/api-key');
      const data = await response.json();
      const apiKey = data.key;

      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&callback=initMap`;
      script.async = true;
      document.head.appendChild(script);
    }

    // Ejecutar carga dinámica
    loadMap();
  </script>
</body>
</html>
